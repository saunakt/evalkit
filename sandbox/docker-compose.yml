# Optional local services for evalkit (not needed for the offline demo).
#   docker compose -f sandbox/docker-compose.yml up -d
services:
  wiremock:
    image: wiremock/wiremock:3.9.1
    ports: ["8089:8080"]
    volumes:
      - ../mocks/wiremock:/home/wiremock
    command: ["--global-response-templating", "--verbose"]
  label-studio:
    image: heartexlabs/label-studio:1.13.1
    ports: ["8090:8080"]
    volumes:
      - label-studio-data:/label-studio/data
volumes:
  label-studio-data: {}
