<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}evalkit report{% endblock %}</title>
<style>
:root { --ok:#1d7a46; --bad:#b42318; --warn:#a15c00; --info:#475467; --line:#d0d5dd; --bg:#f8f9fb; }
* { box-sizing: border-box; }
body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#101828; margin:0; background:#fff; }
main { max-width: 1180px; margin: 0 auto; padding: 24px; }
h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 28px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
h3 { font-size: 15px; margin: 18px 0 6px; }
.meta { color: var(--info); font-size: 13px; }
.badge { display:inline-block; padding: 2px 10px; border-radius: 12px; font-weight: 600; font-size: 12px; color:#fff; }
.PASS, .s-PASS { background: var(--ok); } .FAIL, .s-FAIL { background: var(--bad); }
.WARN, .s-WARN { background: var(--warn); } .INFO, .s-INFO { background: var(--info); }
.s-NOT-TESTED { background: #98a2b3; }
table { border-collapse: collapse; width: 100%; margin: 6px 0 12px; font-size: 13px; }
th, td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
th { background: var(--bg); cursor: pointer; user-select: none; white-space: nowrap; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
ul.reasons { margin: 4px 0; padding-left: 20px; } ul.reasons li.fail { color: var(--bad); } ul.reasons li.warn { color: var(--warn); }
.verdict { padding: 14px 16px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
input.filter { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; width: 260px; margin: 4px 0; }
code, pre { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
pre { background: var(--bg); padding: 8px; overflow-x: auto; white-space: pre-wrap; }
.muted { color: var(--info); }
</style>
</head>
<body>
<main>
{% block body %}{% endblock %}
<p class="meta">Generated by evalkit · {{ r.generated }}</p>
</main>
<script>
// Tiny table sorting and filtering (no external assets).
document.querySelectorAll("table.sortable th").forEach(function (th, idx) {
  th.addEventListener("click", function () {
    var table = th.closest("table"), body = table.tBodies[0];
    var rows = Array.prototype.slice.call(body.rows), asc = th.dataset.asc !== "1";
    rows.sort(function (a, b) {
      var x = a.cells[idx].innerText, y = b.cells[idx].innerText;
      var nx = parseFloat(x), ny = parseFloat(y);
      var c = (!isNaN(nx) && !isNaN(ny)) ? nx - ny : x.localeCompare(y);
      return asc ? c : -c;
    });
    rows.forEach(function (row) { body.appendChild(row); });
    th.dataset.asc = asc ? "1" : "0";
  });
});
document.querySelectorAll("input.filter").forEach(function (inp) {
  inp.addEventListener("input", function () {
    var t = document.getElementById(inp.dataset.table), q = inp.value.toLowerCase();
    Array.prototype.forEach.call(t.tBodies[0].rows, function (row) {
      row.style.display = row.innerText.toLowerCase().indexOf(q) >= 0 ? "" : "none";
    });
  });
});
</script>
</body>
</html>
