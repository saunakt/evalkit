# Fake provider script (offline demo + tests). SUT behaviour lives in examples/shopease/llm.py
# (FakeLLM); this file scripts the judge, simulator and perturb roles.
default_judge: PASS
rules:
  # simulated users (conversation + agent suites); the simulator sees the transcript text
  - {role: simulator, match: "(?s)hidden goal.*ORD-100001.*has been cancelled", response: "<DONE>"}
  - {role: simulator, match: "(?s)hidden goal.*cancelled", response: "Hi, please cancel my order ORD-100001, it is still processing."}
  - {role: simulator, match: "(?s)hidden goal.*return shoes.*30-day", response: "<DONE>"}
  - {role: simulator, match: "(?s)hidden goal.*return shoes", response: "Hello! How many days after delivery can I return shoes?"}
  # LLM perturbations (perturb role)
  - {role: perturb, match: "Paraphrase", response: "Could you tell me whether my order can still be cancelled?"}
  - {role: perturb, match: "Hinglish", response: "Mera order cancel ho sakta hai kya?"}
judge_script:
  - {case: pc-01, judge: policy_compliance, verdict: PASS}
  - {case: pc-02, judge: policy_compliance, verdict: FAIL}
  - {case: pc-03, judge: policy_compliance, verdict: PASS}
  - {case: pc-04, judge: policy_compliance, verdict: PASS}
  - {case: pc-05, judge: policy_compliance, verdict: FAIL}
