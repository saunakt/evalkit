suites:
  agent: 'Tool-using agents: trajectories, end state, policies, faults, reliability (ch. 19–20).'
  classic: Unit tests with a fake LLM, record/replay, contracts, API checks, UI tests (ch. 15).
  coding_agent: 'Coding agents in a sandbox: hidden tests, regressions, diff discipline (ch. 21–22).'
  compliance: Requirement coverage, AI disclosure, data rights, evidence (ch. 27). Runs last.
  conversation: 'Multi-turn conversations: scripted turns and simulated users (ch. 16).'
  finetune: Fine-tuned vs prompted base model comparisons (ch. 29.4).
  guardrails: Guardrail precision/recall, false blocks, added latency, fail mode, bypass (ch. 26).
  migration: Current vs candidate model comparison across suites (ch. 28.5).
  multilingual: Indian languages, scripts and code-mixing (ch. 30).
  multimodal: Voice, images and documents (ch. 29.1–29.3).
  performance: Latency, TTFT, throughput, errors, cost and resilience (ch. 28.1–28.4).
  prompt: System-prompt instruction following, scope handling and format (ch. 14).
  quality: Correctness, format and judged quality of single replies (ch. 5–7).
  rag: 'Retrieval-augmented generation: ingestion, retrieval and generation (ch. 17–18).'
  responsible_ai: Hallucination, bias, toxicity, refusals and PII (ch. 25).
  robustness: Decisions stay stable under perturbations and rephrasing (ch. 14.3, 15).
  security: Red teaming against the OWASP LLM Top 10 (ch. 24).
  skills: 'Agent skills: triggering, execution steps, output quality, with/without (ch. 23).'
